org: alexcaulfield
app: setlistify
# serverless.yml

service: serverless-flask

plugins:
  - serverless-python-requirements
  - serverless-wsgi

custom:
  wsgi:
    app: app.app
    packRequirements: false
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    noDeploy:
      - boto3
      - botocore
provider:
  name: aws
  runtime: python3.11

  stage: dev
  region: us-east-1
  environment:
    SPOTIFY_CLIENT_ID: ${env:SPOTIFY_CLIENT_ID}
    SPOTIFY_CLIENT_SECRET: ${env:SPOTIFY_CLIENT_SECRET}
    SETLIST_FM_API_KEY: ${env:SETLIST_FM_API_KEY}
    APP_SECRET_KEY: ${env:APP_SECRET_KEY}
    REDIRECT_URI: ${env:REDIRECT_URI}
    SCOPE: ${env:SCOPE}
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}

functions:
  app:
    handler: wsgi_handler.handler
    events:
      - http: ANY /
      - http: 'ANY {proxy+}'
        cors: true