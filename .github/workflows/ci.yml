name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  go-test:
    name: Go Test, Vet & Type Generation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v -count=1 ./...

      - name: Verify Generated Types In Sync
        run: |
          go run github.com/gzuidhof/tygo generate
          git diff --exit-code src/api/*.gen.ts

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test

      - name: Build bundle
        run: yarn build
